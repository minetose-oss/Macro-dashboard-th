name: Update macro data (server-side)

on:
  schedule:
    - cron: "0 * * * *"   # รันทุกชั่วโมง (UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate data.json
        run: |
          echo "Node version:" && node -v
          cat > build_data.mjs <<'EOF'
          import { writeFile, readFile } from 'fs/promises';

          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36';
          const TRIES = +(process.env.FETCH_TRIES || 3);

          async function fetchText(url){
            let lastErr;
            for(let a = 1; a <= TRIES; a++){
              try{
                const r = await fetch(url, { headers: {
                  'User-Agent': UA,
                  'Accept': 'text/csv,text/plain,*/*;q=0.8',
                  'Accept-Language': 'en-US,en;q=0.9'
                }});
                if(!r.ok) throw new Error(`Fetch ${url} ${r.status}`);
                return await r.text();
              }catch(e){
                lastErr = e;
                if(a < TRIES){
                  const wait = a * 10;
                  console.warn(`Attempt ${a}/${TRIES} failed: ${e.message} - retry in ${wait}s`);
                  await new Promise(res => setTimeout(res, wait * 1000));
                }
              }
            }
            throw lastErr;
          }
          function parseCSV(text){
            const lines = text.trim().split(/\r?\n/);
            const header = lines.shift().split(',').map(s => s.trim());
            const rows = lines.map(l => l.split(',').map(s => s.trim()));
            return { header, rows };
          }
          function dateCol(header){
            return header.findIndex(h => /^(DATE|observation_date|Friday_of_Week)$/i.test(h) || h.toLowerCase().includes('date'));
          }
          function normalizeDate(d){
            const m = String(d).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
            return d;
          }
          function computeWoW(dates, vals){
            let i = vals.length-1;
            while(i>=0 && (vals[i]==null || isNaN(vals[i]))) i--;
            if(i<0) return {last:null, delta:null};
            const last = +vals[i];
            const lastDate = new Date(dates[i]);
            const target = new Date(lastDate.getTime() - 7*24*3600*1000);
            let j=i-1;
            for(; j>=0; j--){
              const dj = new Date(dates[j]);
              if(dj <= target && vals[j]!=null && !isNaN(vals[j])) break;
            }
            return { last, delta: j>=0 ? last - (+vals[j]) : null };
          }
          async function fredSeries(id){
            const txt = await fetchText(`https://fred.stlouisfed.org/graph/fredgraph.csv?id=${id}`);
            const {header, rows} = parseCSV(txt);
            const di = dateCol(header);
            const vi = header.indexOf(id);
            if(di < 0 || vi < 0) throw new Error(`Bad FRED header for ${id}: ${header.join(',')}`);
            const x = [], y = [];
            for(const r of rows){ x.push(r[di]); y.push(r[vi]==='.' ? null : +r[vi]); }
            const wow = computeWoW(x,y);
            const keep = 400;
            return { id, x: x.slice(-keep), y: y.slice(-keep), last: wow.last, delta: wow.delta };
          }
          async function nfci(){
            const txt = await fetchText("https://www.chicagofed.org/~/media/publications/nfci/nfci-data-series-csv.csv");
            const {header, rows} = parseCSV(txt);
            const di = dateCol(header);
            const ni = header.findIndex(h=>h.toUpperCase()==='NFCI');
            const ai = header.findIndex(h=>h.toUpperCase()==='ANFCI');
            if(di < 0 || ni < 0) throw new Error(`Bad NFCI header: ${header.join(',')}`);
            const x=[], yN=[], yA=[];
            for(const r of rows){
              if(!r[di]) continue;
              x.push(normalizeDate(r[di]));
              yN.push(r[ni] ? +r[ni] : null);
              yA.push(ai>=0 && r[ai] ? +r[ai] : null);
            }
            const keep = 400;
            return { x: x.slice(-keep), yN: yN.slice(-keep), yA: yA.slice(-keep) };
          }
          async function dxy(){
            try{
              const j = await (await fetch("https://query1.finance.yahoo.com/v7/finance/quote?symbols=DX-Y.NYB,DX=F", { headers: { 'User-Agent': UA } })).json();
              const arr = j?.quoteResponse?.result || [];
              for(const q of arr){ if(typeof q.regularMarketPrice === 'number') return {last:q.regularMarketPrice, delta:null, source:'yahoo'}; }
            }catch(e){}
            const s = await fredSeries('DTWEXBGS');
            return { last: s.last, delta: s.delta, source: 'DTWEXBGS' };
          }

          // Previous data.json (from checkout) = fallback when a source is down/blocked
          let prev = null;
          try { prev = JSON.parse(await readFile('data.json', 'utf8')); } catch {}

          async function withFallback(name, fn){
            try{
              const fresh = await fn();
              return { ...fresh, stale: false };
            }catch(e){
              const old = prev?.series?.[name];
              if(old){
                console.warn(`WARN: ${name} failed (${e.message}) - reusing previous values`);
                return { ...old, stale: true };
              }
              throw new Error(`${name} failed and no previous data.json to fall back on: ${e.message}`);
            }
          }

          (async ()=>{
            const vix  = await withFallback('vix',  () => fredSeries('VIXCLS'));
            const real = await withFallback('real', () => fredSeries('DFII10'));
            const hy   = await withFallback('hy',   () => fredSeries('BAMLH0A0HYM2'));
            const bbb  = await withFallback('bbb',  () => fredSeries('BAMLC0A4CBBB'));
            const fc   = await withFallback('nfci', nfci);
            const usd  = await withFallback('dxy',  dxy);

            const series = { vix, real, hy, bbb, nfci: fc, dxy: usd };
            const all = Object.values(series);
            const staleCount = all.filter(s => s.stale).length;

            if(staleCount === all.length){
              console.log('All sources failed - keeping existing data.json unchanged');
              process.exit(0);
            }

            const data = { updated: new Date().toISOString(), series };
            await writeFile('data.json', JSON.stringify(data));
            console.log(`Wrote data.json ${data.updated} (fresh: ${all.length-staleCount}/${all.length}) vix ${vix.last} nfci ${fc.x.length}`);
          })().catch(e=>{ console.error(e); process.exit(1); });
          EOF

          node build_data.mjs

      - name: Commit data.json
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update data.json"
            git push
          else
            echo "No changes"
          fi
